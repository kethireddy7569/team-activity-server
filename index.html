            </div>

        id="errorBox"

            </div>

        </div>

            <h3>

                id="offlineEmployees"
                class="summary-number offline-number"

        </div>

<script>


const API_URL = "/api/team";


function formatDateTime(
    timestamp
) {

    if (!timestamp) {

        return "--";
    }


    const date = new Date(
        timestamp
    );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "--";
    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",

            month: "2-digit",

            year: "2-digit",

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit",

            hour12: true
        }
    );
}


async function loadTeamData() {


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    try {


        const response =
            await fetch(
                API_URL,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            throw new Error(
                "Invalid server response"
            );
        }


        errorBox.style.display =
            "none";


    
        document.getElementById(
            "totalEmployees"
        ).textContent =
            data.total_employees || 0;


        document.getElementById(
            "activeEmployees"
        ).textContent =
            data.active_employees || 0;


        document.getElementById(
            "offlineEmployees"
        ).textContent =
            data.offline_employees || 0;


        
        renderEmployees(
            data.employees || []
        );


        

        document.getElementById(
            "lastRefresh"
        ).textContent =
            new Date().toLocaleString(
                "en-IN",
                {
                    day: "2-digit",

                    month: "2-digit",

                    year: "2-digit",

                    hour: "2-digit",

                    minute: "2-digit",

                    second: "2-digit",

                    hour12: true
                }
            );


    }

    catch (error) {


        console.error(
            "Dashboard error:",
            error
        );


        errorBox.style.display =
            "block";


        document.getElementById(
            "totalEmployees"
        ).textContent = "0";


        document.getElementById(
            "activeEmployees"
        ).textContent = "0";


        document.getElementById(
            "offlineEmployees"
        ).textContent = "0";


        document.getElementById(
            "employeeGrid"
        ).innerHTML = "";
    }
}



function renderEmployees(
    employees
) {


    const grid =
        document.getElementById(
            "employeeGrid"
        );


    grid.innerHTML = "";


    if (
        employees.length === 0
    ) {

        grid.innerHTML = `
            <div class="employee-card">
                <div class="no-data">
                    No employee activity available.
                </div>
            </div>
        `;

        return;
    }


    // Active employees first

    employees.sort(
        (a, b) => {

            if (
                a.status ===
                b.status
            ) {

                return 0;
            }

            return a.status ===
                "active"
                ? -1
                : 1;
        }
    );


    employees.forEach(
        employee => {

            const card =
                document.createElement(
                    "div"
                );


            const isActive =
                employee.status ===
                "active";


            card.className =
                "employee-card" +
                (
                    isActive
                        ? ""
                        : " offline"
                );


           
            const usage =
                employee.application_usage
                || {};


            const usageEntries =
                Object.entries(
                    usage
                );


            let usageHTML = "";


            if (
                usageEntries.length === 0
            ) {

                usageHTML = `
                    <div class="no-data">
                        No application usage data.
                    </div>
                `;

            }

            else {

                usageEntries.forEach(
                    ([app, time]) => {

                        usageHTML += `
                            <tr>
                                <td>
                                    ${escapeHTML(app)}
                                </td>

                                <td>
                                    ${escapeHTML(time)}
                                </td>
                            </tr>
                        `;
                    }
                );

                usageHTML = `
                    <table class="usage-table">

                        <thead>

                            <tr>

                                <th>
                                    Application
                                </th>

                                <th>
                                    Time Used
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            ${usageHTML}

                        </tbody>

                    </table>
                `;
            }


           

            card.innerHTML = `

                <div class="employee-header">

                    <div class="employee-id">

                        ${escapeHTML(
                            employee.employee_id
                            || "Unknown"
                        )}

                    </div>


                    <div class="
                        status
                        ${
                            isActive
                                ? "active"
                                : "offline"
                        }
                    ">

                        ${
                            isActive
                                ? "Active"
                                : "Offline"
                        }

                    </div>

                </div>


                <div class="details">


                    <div class="detail-row">

                        <div class="detail-label">
                            Current Application
                        </div>

                        <div class="detail-value">

                            ${
                                escapeHTML(
                                    employee.application
                                    || "Unknown"
                                )
                            }

                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Observed Active Time
                        </div>

                        <div class="detail-value">

                            ${
                                escapeHTML(
                                    employee.active_time
                                    || "0h 0m"
                                )
                            }

                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Last Sync
                        </div>

                        <div class="detail-value">

                            ${
                                formatDateTime(
                                    employee.timestamp
                                )
                            }

                        </div>

                    </div>


                </div>


                <div class="usage-title">
                    Application Usage
                </div>


                ${
                    usageEntries.length === 0
                        ? `
                            <div class="no-data">
                                No application usage data.
                            </div>
                        `
                        : usageHTML
                }

            `;


            grid.appendChild(
                card
            );

        }
    );
}



function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value);


    return div.innerHTML;
}



loadTeamData();



// Every 60 seconds

setInterval(
    loadTeamData,
    60000
);


</script>

<title>Team Activity Dashboard</title>

    box-sizing: border-box;
}

        Arial,

}

}


/* ERROR */

.error-box {

    display: none;

    background: #fee2e2;

    padding: 15px;

}


/* SUMMARY */

.summary {

    display: grid;

    grid-template-columns:

    gap: 20px;

}

    box-shadow:

}


.summary-label {

    color: #64748b;

    font-size: 14px;
}


.summary-value {

    margin-top: 8px;

    font-size: 30px;

    font-weight: 700;
}


/* EMPLOYEE GRID */

.employee-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}


.employee-card {

    background: white;

    padding: 22px;

}


.employee-card.offline {

    opacity: 0.75;
}


.employee-header {

    display: flex;

    align-items: flex-start;

/* DETAILS */

.details {

    border-top:
        1px solid #e2e8f0;

    display: grid;

    gap: 10px;

    padding: 8px 0;

    font-size: 14px;

.detail-value {

    font-weight: 600;

    font-size: 14px;

    .summary {

        grid-template-columns:
            1fr;

    .employee-grid {

        grid-template-columns:
            1fr;
    }


    .detail-row {

        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1 class="title">
            Team Activity Dashboard
        </h1>

        <div class="subtitle">
            Application Activity Tracking & Centralized Monitoring
        </div>

        <div class="refresh-info">
            Dashboard refreshes automatically every 1 minute.
            Last dashboard refresh:
            <span id="lastRefresh">-</span>
        </div>

        <div class="connection"
             id="connectionStatus">

            ● Connected

        </div>

    </div>


    <!-- DATE SELECTOR -->

    <div class="date-section">

        <label for="datePicker">
            Select Date:
        </label>

        <input
            type="date"
            id="datePicker"
        >

        <button
            class="today-btn"
            onclick="loadToday()">

            Today

        </button>

        <span
            class="selected-date"
            id="selectedDateText">

            Loading...

        </span>

    </div>


    <!-- ERROR -->

    <div
        class="error-box"
        id="errorBox">

    </div>


    <!-- SUMMARY -->

    <div class="summary">


        <div class="summary-card">

            <div class="summary-label">
                Total Employees
            </div>

            <div
                class="summary-value"
                id="totalEmployees">

                0

            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Active Employees
            </div>

            <div
                class="summary-value"
                id="activeEmployees">

                0

            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Offline / Inactive
            </div>

            <div
                class="summary-value"
                id="offlineEmployees">

                0

            </div>

        </div>


    </div>


    <!-- EMPLOYEE CARDS -->

    <div
        class="employee-grid"
        id="employeeGrid">

    </div>


</div>


<script>


// =====================================================
// CONFIGURATION
// =====================================================

const API_URL = "/api/team";

const DAILY_API_URL = "/api/team/daily";


// =====================================================
// DATE HELPERS
// =====================================================

function getTodayDate() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatSelectedDate(dateString) {

    if (!dateString) {
        return "-";
    }

    const parts =
        dateString.split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}


// =====================================================
// DATE PICKER
// =====================================================

const datePicker =
    document.getElementById(
        "datePicker"
    );


datePicker.value =
    getTodayDate();


datePicker.addEventListener(
    "change",
    function () {

        loadSelectedDate(
            this.value
        );

    }
);


// =====================================================
// DATE DATA
// =====================================================

async function loadSelectedDate(
    selectedDate
) {

    if (!selectedDate) {
        return;
    }


    document.getElementById(
        "selectedDateText"
    ).textContent =
        "Selected Date: " +
        formatSelectedDate(
            selectedDate
        );


    /*
        If today's date is selected,
        use live /api/team data.

        For previous dates, use
        /api/team/daily?date=YYYY-MM-DD
    */

    if (
        selectedDate ===
        getTodayDate()
    ) {

        await loadLiveTeamData();

    } else {

        await loadDailyTeamData(
            selectedDate
        );

    }

}


// =====================================================
// TODAY BUTTON
// =====================================================

function loadToday() {

    const today =
        getTodayDate();

    datePicker.value =
        today;

    loadSelectedDate(
        today
    );

}


// =====================================================
// LIVE TEAM DATA
// =====================================================

async function loadLiveTeamData() {

    hideError();


    try {

        const response =
            await fetch(
                API_URL
            );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            throw new Error(
                data.message ||
                "Unable to load team data"
            );

        }


        updateSummary(
            data.employees || []
        );


        renderEmployees(
            data.employees || [],
            false
        );


        updateRefreshTime();


    } catch (error) {

        showError(
            "Unable to load live team data: " +
            error.message
        );

    }

}


// =====================================================
// PREVIOUS DATE DATA
// =====================================================

async function loadDailyTeamData(
    selectedDate
) {

    hideError();


    try {

        const response =
            await fetch(
                `${DAILY_API_URL}?date=${encodeURIComponent(selectedDate)}`
            );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            throw new Error(
                data.message ||
                "Unable to load daily data"
            );

        }


        const employees =
            data.employees || [];


        updateSummary(
            employees
        );


        renderEmployees(
            employees,
            true
        );


        updateRefreshTime();


    } catch (error) {

        showError(
            "Unable to load data for " +
            formatSelectedDate(
                selectedDate
            ) +
            ": " +
            error.message
        );

    }

}


// =====================================================
// SUMMARY
// =====================================================

function updateSummary(
    employees
) {

    const total =
        employees.length;


    let active = 0;


    employees.forEach(
        employee => {

            if (
                employee.status ===
                "active"
            ) {

                active++;

            }

        }
    );


    const offline =
        total - active;


    document.getElementById(
        "totalEmployees"
    ).textContent =
        total;


    document.getElementById(
        "activeEmployees"
    ).textContent =
        active;


    document.getElementById(
        "offlineEmployees"
    ).textContent =
        offline;

}


// =====================================================
// RENDER EMPLOYEES
// =====================================================

function renderEmployees(
    employees,
    isHistorical
) {

    const grid =
        document.getElementById(
            "employeeGrid"
        );


    grid.innerHTML = "";


    if (
        !employees ||
        employees.length === 0
    ) {

        grid.innerHTML = `
            <div class="no-data">
                No activity data found for
                the selected date.
            </div>
        `;

        return;

    }


    // Active employees first.

    employees.sort(
        (a, b) => {

            if (
                a.status ===
                b.status
            ) {

                return 0;

            }

            return a.status ===
                "active"
                ? -1
                : 1;

        }
    );


    employees.forEach(
        employee => {

            const card =
                document.createElement(
                    "div"
                );


            const status =
                employee.status ===
                "active"
                    ? "active"
                    : "offline";


            const statusText =
                status === "active"
                    ? "Active"
                    : "Offline / Inactive";


            card.className =
                `employee-card ${status}`;


            const employeeName =
                escapeHTML(
                    employee.employee_name ||
                    "Employee Name Not Configured"
                );


            const employeeId =
                escapeHTML(
                    employee.employee_id ||
                    "-"
                );


            const application =
                escapeHTML(
                    employee.application ||
                    employee.last_application ||
                    "Unknown"
                );


            const activeTime =
                escapeHTML(
                    employee.active_time ||
                    "0h 0m"
                );


            const timestamp =
                employee.last_sync_ist ||
                employee.last_sync ||
                employee.timestamp;


            const formattedTime =
                formatDateTime(
                    timestamp
                );


            const usage =
                employee.application_usage ||
                {};


            let usageRows = "";


            const usageEntries =
                Object.entries(
                    usage
                );


            if (
                usageEntries.length === 0
            ) {

                usageRows = `
                    <tr>
                        <td colspan="2">
                            No application usage data
                        </td>
                    </tr>
                `;

            } else {

                usageEntries.sort(
                    (a, b) =>
                        Number(b[1]) -
                        Number(a[1])
                );


                usageEntries.forEach(
                    ([appName, seconds]) => {

                        usageRows += `
                            <tr>

                                <td>
                                    ${escapeHTML(appName)}
                                </td>

                                <td>
                                    ${formatDuration(seconds)}
                                </td>

                            </tr>
                        `;

                    }
                );

            }


            card.innerHTML = `

                <div class="employee-header">

                    <div>

                        <div class="employee-name">
                            ${employeeName}
                        </div>

                        <div class="employee-id">
                            Employee ID:
                            ${employeeId}
                        </div>

                    </div>


                    <div class="status ${status}">
                        ${statusText}
                    </div>

                </div>


                <div class="details">


                    <div class="detail-row">

                        <div class="detail-label">
                            Current Application
                        </div>

                        <div class="detail-value">
                            ${application}
                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Observed Active Time
                        </div>

                        <div class="detail-value">
                            ${activeTime}
                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Last Sync
                        </div>

                        <div class="detail-value">
                            ${formattedTime}
                        </div>

                    </div>


                    ${
                        isHistorical
                        ? `
                        <div class="detail-row">

                            <div class="detail-label">
                                Record Date
                            </div>

                            <div class="detail-value">
                                ${formatSelectedDate(
                                    employee.date
                                )}
                            </div>

                        </div>
                        `
                        : ""
                    }


                </div>


                <div class="usage-title">
                    Application Usage
                </div>


                <table class="usage-table">

                    <thead>

                        <tr>

                            <th>
                                Application
                            </th>

                            <th>
                                Time Used
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${usageRows}

                    </tbody>

                </table>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


// =====================================================
// FORMAT DATE/TIME
// =====================================================

function formatDateTime(
    timestamp
) {

    if (!timestamp) {

        return "-";

    }


    try {

        const date =
            new Date(timestamp);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "-";

        }


        return date.toLocaleString(
            "en-IN",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true,
                timeZone:
                    "Asia/Kolkata"
            }
        );

    } catch (error) {

        return "-";

    }

}


// =====================================================
// FORMAT DURATION
// =====================================================

function formatDuration(
    seconds
) {

    seconds =
        Number(seconds) || 0;


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    return `${hours}h ${minutes}m`;

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================================
// ERROR HANDLING
// =====================================================

function showError(
    message
) {

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.textContent =
        message;


    errorBox.style.display =
        "block";


    document.getElementById(
        "connectionStatus"
    ).textContent =
        "● Connection Error";


    document.getElementById(
        "connectionStatus"
    ).style.color =
        "#dc2626";

}


function hideError() {

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.style.display =
        "none";


    document.getElementById(
        "connectionStatus"
    ).textContent =
        "● Connected";


    document.getElementById(
        "connectionStatus"
    ).style.color =
        "#16a34a";

}


// =====================================================
// REFRESH TIME
// =====================================================

function updateRefreshTime() {

    document.getElementById(
        "lastRefresh"
    ).textContent =
        new Date().toLocaleTimeString(
            "en-IN",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            }
        );

}


// =====================================================
// INITIAL LOAD
// =====================================================

loadSelectedDate(
    getTodayDate()
);


// =====================================================
// AUTO REFRESH
// =====================================================

setInterval(
    function () {

        const selectedDate =
            datePicker.value;


        if (
            selectedDate ===
            getTodayDate()
        ) {

            loadLiveTeamData();

        } else {

            loadDailyTeamData(
                selectedDate
            );

        }

    },
    60000
);

</script>
