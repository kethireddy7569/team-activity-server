<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Team Activity Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;

            color: #1f2937;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: white;

            padding: 25px 35px;

            border-bottom:
                1px solid #e5e7eb;
        }


        .header h1 {

            margin: 0;

            font-size: 28px;

            color: #172554;
        }


        .header p {

            margin-top: 6px;

            color: #6b7280;

            font-size: 14px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 95%;

            max-width: 1400px;

            margin: 25px auto;
        }


        /* =========================
           SUMMARY CARDS
        ========================= */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .summary-card {

            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.06);
        }


        .summary-card h3 {

            margin: 0;

            font-size: 15px;

            color: #6b7280;

            font-weight: 500;
        }


        .number {

            margin-top: 10px;

            font-size: 34px;

            font-weight: bold;
        }


        .total-number {
            color: #2563eb;
        }


        .active-number {
            color: #16a34a;
        }


        .offline-number {
            color: #dc2626;
        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 18px;

            color: #172554;
        }


        /* =========================
           EMPLOYEE GRID
        ========================= */

        #employeeContainer {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        /* =========================
           EMPLOYEE CARD
        ========================= */

        .employee-card {

            background: white;

            border-radius: 15px;

            padding: 22px;

            border:
                1px solid #e5e7eb;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.06);
        }


        .employee-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .employee-id {

            font-size: 19px;

            font-weight: bold;

            color: #111827;
        }


        /* =========================
           STATUS
        ========================= */

        .status {

            padding:
                8px 15px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }


        .status.active {

            background: #d1fae5;

            color: #047857;
        }


        .status.offline {

            background: #fee2e2;

            color: #b91c1c;
        }


        /* =========================
           INFO ROW
        ========================= */

        .info-row {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            padding:
                11px 0;

            border-bottom:
                1px solid #f0f0f0;
        }


        .info-label {

            color: #6b7280;

            font-size: 14px;
        }


        .info-value {

            font-size: 14px;

            font-weight: 600;

            text-align: right;

            max-width: 60%;
        }


        /* =========================
           APPLICATION USAGE
        ========================= */

        .usage-title {

            margin-top: 20px;

            margin-bottom: 10px;

            font-size: 15px;

            font-weight: bold;

            color: #374151;
        }


        .usage-item {

            display: flex;

            justify-content:
                space-between;

            padding: 7px 0;

            font-size: 13px;
        }


        .app-name {

            color: #374151;
        }


        .app-time {

            font-weight: bold;

            color: #111827;
        }


        .no-data {

            color: #9ca3af;

            font-size: 13px;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            background: white;

            padding: 40px;

            text-align: center;

            border-radius: 15px;

            color: #6b7280;
        }


        /* =========================
           ERROR
        ========================= */

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;
        }


        /* =========================
           LAST UPDATED
        ========================= */

        .last-updated {

            margin-top: 25px;

            text-align: center;

            color: #6b7280;

            font-size: 13px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .summary {

                grid-template-columns:
                    1fr;
            }


            #employeeContainer {

                grid-template-columns:
                    1fr;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>
            Team Activity Monitoring Dashboard
        </h1>

        <p>
            Application Activity Tracking &
            Centralized Monitoring
        </p>

    </div>


    <!-- =========================
         MAIN
    ========================= -->

    <div class="container">


        <!-- =========================
             SUMMARY
        ========================= -->

        <div class="summary">


            <div class="summary-card">

                <h3>
                    Total Employees
                </h3>

                <div
                    id="totalEmployees"
                    class="number total-number"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <h3>
                    Active Employees
                </h3>

                <div
                    id="activeEmployees"
                    class="number active-number"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <h3>
                    Offline Employees
                </h3>

                <div
                    id="offlineEmployees"
                    class="number offline-number"
                >
                    0
                </div>

            </div>


        </div>


        <!-- =========================
             ERROR MESSAGE
        ========================= -->

        <div
            id="errorMessage"
            class="error"
            style="display:none;"
        >
        </div>


        <!-- =========================
             EMPLOYEE ACTIVITY
        ========================= -->

        <div class="section-title">

            Employee Activity

        </div>


        <div id="employeeContainer">

            <div class="loading">

                Loading employee activity...

            </div>

        </div>


        <!-- =========================
             LAST UPDATED
        ========================= -->

        <div
            id="lastUpdated"
            class="last-updated"
        >

            Updating...

        </div>


    </div>



    <script>


        /* =================================================
           API URL

           Same server API is used.

           Local:
           http://127.0.0.1:8000/api/team

           Vercel:
           https://team-activity-server.vercel.app/api/team
        ================================================= */

        const API_URL = "/api/team";


        /* =================================================
           FORMAT APPLICATION NAME
        ================================================= */

        function formatApplicationName(name) {

            if (!name) {

                return "Unknown";

            }


            return String(name)

                .replace(/_/g, " ")

                .replace(/\.exe$/i, "")

                .trim();
        }


        /* =================================================
           ESCAPE HTML
        ================================================= */

        function escapeHtml(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");
        }


        /* =================================================
           DATE / TIME FORMAT
        ================================================= */

        function formatDateTime(value) {

            if (!value) {

                return "Not available";

            }


            try {

                const date =
                    new Date(value);


                if (
                    isNaN(
                        date.getTime()
                    )
                ) {

                    return value;

                }


                return date.toLocaleString(
                    "en-IN",
                    {

                        day: "2-digit",

                        month: "2-digit",

                        year: "2-digit",

                        hour: "numeric",

                        minute: "2-digit",

                        second: "2-digit",

                        hour12: true

                    }
                );

            }

            catch (error) {

                return value;

            }

        }


        /* =================================================
           FORMAT DURATION
        ================================================= */

        function formatDuration(seconds) {

            seconds =
                Number(seconds) || 0;


            const hours =
                Math.floor(
                    seconds / 3600
                );


            const minutes =
                Math.floor(
                    (seconds % 3600) / 60
                );


            return (
                hours +
                "h " +
                minutes +
                "m"
            );
        }


        /* =================================================
           APPLICATION USAGE
        ================================================= */

        function createApplicationUsage(
            applicationUsage
        ) {

            if (
                !applicationUsage ||
                Object.keys(
                    applicationUsage
                ).length === 0
            ) {

                return `

                    <div class="no-data">

                        No application activity
                        available

                    </div>

                `;

            }


            return Object.entries(
                applicationUsage
            )

            .map(
                ([application, time]) => {

                    return `

                        <div
                            class="usage-item"
                        >

                            <span
                                class="app-name"
                            >

                                ${escapeHtml(
                                    formatApplicationName(
                                        application
                                    )
                                )}

                            </span>


                            <span
                                class="app-time"
                            >

                                ${escapeHtml(
                                    String(time)
                                )}

                            </span>

                        </div>

                    `;

                }
            )

            .join("");

        }


        /* =================================================
           CREATE EMPLOYEE CARD
        ================================================= */

        function createEmployeeCard(
            employee
        ) {


            const employeeId =
                employee.employee_id ||
                "Unknown";


            /*
             STATUS

             active  = Active
             offline = Offline
            */

            const status =
                String(
                    employee.status ||
                    "offline"
                ).toLowerCase();


            const isActive =
                status === "active";


            const statusText =
                isActive
                    ? "Active"
                    : "Offline";


            const statusClass =
                isActive
                    ? "active"
                    : "offline";


            const application =
                employee.application ||
                employee.last_application ||
                "Unknown";


            const activeTime =
                employee.active_time ||
                formatDuration(
                    employee.active_seconds
                );


            const lastSync =
                employee.last_sync_ist ||
                employee.timestamp ||
                employee.last_sync ||
                "Not available";


            const applicationUsage =
                employee.application_usage ||
                {};


            return `

                <div
                    class="employee-card"
                >


                    <div
                        class="employee-top"
                    >


                        <div
                            class="employee-id"
                        >

                            ${escapeHtml(
                                employeeId
                            )}

                        </div>


                        <div
                            class="status ${statusClass}"
                        >

                            ${statusText}

                        </div>


                    </div>



                    <div
                        class="info-row"
                    >

                        <span
                            class="info-label"
                        >

                            Current Application

                        </span>


                        <span
                            class="info-value"
                        >

                            ${escapeHtml(
                                formatApplicationName(
                                    application
                                )
                            )}

                        </span>

                    </div>



                    <div
                        class="info-row"
                    >

                        <span
                            class="info-label"
                        >

                            Observed Active Time

                        </span>


                        <span
                            class="info-value"
                        >

                            ${escapeHtml(
                                activeTime
                            )}

                        </span>

                    </div>



                    <div
                        class="info-row"
                    >

                        <span
                            class="info-label"
                        >

                            Last Sync

                        </span>


                        <span
                            class="info-value"
                        >

                            ${escapeHtml(
                                formatDateTime(
                                    lastSync
                                )
                            )}

                        </span>

                    </div>



                    <div
                        class="usage-title"
                    >

                        Application Usage

                    </div>


                    ${createApplicationUsage(
                        applicationUsage
                    )}


                </div>

            `;

        }


        /* =================================================
           LOAD TEAM DATA
        ================================================= */

        async function loadTeamData() {


            try {


                const response =
                    await fetch(
                        API_URL,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server returned " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (
                    !data ||
                    !Array.isArray(
                        data.employees
                    )
                ) {

                    throw new Error(
                        "Invalid team data"
                    );

                }


                const employees =
                    data.employees;


                /* =========================================
                   TOTAL EMPLOYEES
                ========================================= */

                const totalEmployees =
                    employees.length;


                /* =========================================
                   ACTIVE EMPLOYEES
                ========================================= */

                const activeEmployees =
                    employees.filter(
                        employee => {

                            return String(
                                employee.status ||
                                ""
                            ).toLowerCase()
                            === "active";

                        }
                    ).length;


                /* =========================================
                   OFFLINE EMPLOYEES
                ========================================= */

                const offlineEmployees =
                    employees.filter(
                        employee => {

                            return String(
                                employee.status ||
                                ""
                            ).toLowerCase()
                            !== "active";

                        }
                    ).length;


                /* =========================================
                   UPDATE SUMMARY
                ========================================= */

                document.getElementById(
                    "totalEmployees"
                ).textContent =
                    totalEmployees;


                document.getElementById(
                    "activeEmployees"
                ).textContent =
                    activeEmployees;


                document.getElementById(
                    "offlineEmployees"
                ).textContent =
                    offlineEmployees;


                /* =========================================
                   EMPLOYEE CARDS
                ========================================= */

                const container =
                    document.getElementById(
                        "employeeContainer"
                    );


                if (
                    employees.length === 0
                ) {

                    container.innerHTML = `

                        <div
                            class="loading"
                        >

                            No employee activity
                            available.

                        </div>

                    `;

                }

                else {

                    container.innerHTML =
                        employees
                        .map(
                            employee =>
                                createEmployeeCard(
                                    employee
                                )
                        )
                        .join("");

                }


                /* =========================================
                   LAST UPDATED
                ========================================= */

                document.getElementById(
                    "lastUpdated"
                ).textContent =
                    "Dashboard updated: " +
                    new Date()
                    .toLocaleString(
                        "en-IN"
                    );


                /* =========================================
                   HIDE ERROR
                ========================================= */

                document.getElementById(
                    "errorMessage"
                ).style.display =
                    "none";


            }

            catch (error) {


                console.error(
                    "Dashboard error:",
                    error
                );


                const errorBox =
                    document.getElementById(
                        "errorMessage"
                    );


                errorBox.textContent =
                    "Unable to load team activity. Please check the server connection.";


                errorBox.style.display =
                    "block";

            }

        }


        /* =================================================
           FIRST LOAD
        ================================================= */

        loadTeamData();


        /* =================================================
           AUTO REFRESH - EVERY 1 MINUTE
           
           60000 milliseconds = 1 minute
        ================================================= */

        setInterval(
            loadTeamData,
            60000
        );


    </script>


</body>

</html>
