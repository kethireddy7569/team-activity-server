<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Team Activity Dashboard
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #f7f9fc
                );

            color: #1f2937;
        }


        .container {

            max-width: 1400px;

            margin: auto;

            padding: 30px;
        }


        /* =================================================
           HEADER
           ================================================= */

        .header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            margin-bottom: 25px;

            gap: 20px;
        }


        .title {

            margin: 0;

            color: #173b75;

            font-size: 34px;
        }


        .subtitle {

            margin-top: 8px;

            color: #64748b;

            font-size: 16px;
        }


        .refresh-info {

            text-align: right;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;
        }


        .connection {

            color: #15803d;

            font-weight: bold;
        }


        /* =================================================
           ERROR
           ================================================= */

        .error-box {

            display: none;

            background: #fee2e2;

            color: #991b1b;

            padding: 14px 18px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-weight: bold;
        }


        /* =================================================
           SUMMARY CARDS
           ================================================= */

        .summary {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 20px;

            margin-bottom: 35px;
        }


        .summary-card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(
                    15,
                    23,
                    42,
                    0.08
                );
        }


        .summary-card h3 {

            margin: 0;

            color: #475569;

            font-size: 17px;
        }


        .summary-number {

            margin-top: 12px;

            font-size: 42px;

            font-weight: bold;

            color: #173b75;
        }


        .active-number {

            color: #15803d;
        }


        .offline-number {

            color: #dc2626;
        }


        /* =================================================
           SECTION
           ================================================= */

        .section-title {

            color: #173b75;

            font-size: 25px;

            margin-bottom: 18px;
        }


        /* =================================================
           EMPLOYEE GRID
           ================================================= */

        .employee-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 22px;
        }


        /* =================================================
           EMPLOYEE CARD
           ================================================= */

        .employee-card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(
                    15,
                    23,
                    42,
                    0.08
                );

            border-left:
                6px solid #16a34a;
        }


        .employee-card.offline {

            border-left-color:
                #dc2626;
        }


        .employee-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            padding-bottom: 18px;

            border-bottom:
                1px solid #e5e7eb;

            gap: 15px;
        }


        .employee-id {

            font-size: 22px;

            font-weight: bold;

            color: #173b75;
        }


        /* =================================================
           STATUS
           ================================================= */

        .status {

            padding:
                8px 15px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

            text-transform:
                capitalize;
        }


        .status.active {

            background: #dcfce7;

            color: #15803d;
        }


        .status.offline {

            background: #fee2e2;

            color: #dc2626;
        }


        /* =================================================
           DETAILS
           ================================================= */

        .details {

            margin-top: 20px;
        }


        .detail-row {

            display: grid;

            grid-template-columns:
                180px
                1fr;

            padding:
                10px 0;

            border-bottom:
                1px solid #f1f5f9;

            gap: 15px;
        }


        .detail-label {

            color: #64748b;

            font-size: 15px;
        }


        .detail-value {

            font-weight: bold;

            text-align: right;

            color: #1e293b;
        }


        /* =================================================
           APPLICATION USAGE
           ================================================= */

        .usage-title {

            margin-top: 22px;

            margin-bottom: 12px;

            font-size: 17px;

            font-weight: bold;

            color: #173b75;
        }


        .usage-table {

            width: 100%;

            border-collapse:
                collapse;
        }


        .usage-table th {

            text-align: left;

            color: #64748b;

            padding:
                8px 5px;

            font-size: 14px;
        }


        .usage-table th:last-child {

            text-align: right;
        }


        .usage-table td {

            padding:
                8px 5px;

            border-top:
                1px solid #f1f5f9;

            font-size: 14px;
        }


        .usage-table td:last-child {

            text-align: right;

            font-weight: bold;
        }


        .no-data {

            color: #94a3b8;

            padding:
                10px 0;
        }


        /* =================================================
           RESPONSIVE
           ================================================= */

        @media (
            max-width: 900px
        ) {

            .summary {

                grid-template-columns:
                    1fr;
            }


            .employee-grid {

                grid-template-columns:
                    1fr;
            }


            .header {

                flex-direction:
                    column;
            }


            .refresh-info {

                text-align:
                    left;
            }
        }


    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="header">

        <div>

            <h1 class="title">
                Team Activity Dashboard
            </h1>

            <div class="subtitle">
                Application Activity Tracking &amp;
                Centralized Monitoring
            </div>

        </div>


        <div class="refresh-info">

            <div>
                Automatic refresh: Every 1 minute
            </div>

            <div>
                Last dashboard refresh:
                <span id="lastRefresh">
                    --
                </span>
            </div>

            <div class="connection">
                ● Connected
            </div>

        </div>

    </div>


    <!-- =================================================
         ERROR
         ================================================= -->

    <div
        id="errorBox"
        class="error-box"
    >
        Unable to load activity data.
        Please check the server.
    </div>


    <!-- =================================================
         SUMMARY
         ================================================= -->

    <div class="summary">


        <div class="summary-card">

            <h3>
                Total Employees
            </h3>

            <div
                id="totalEmployees"
                class="summary-number"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <h3>
                Active Employees
            </h3>

            <div
                id="activeEmployees"
                class="summary-number active-number"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <h3>
                Offline Employees
            </h3>

            <div
                id="offlineEmployees"
                class="summary-number offline-number"
            >
                0
            </div>

        </div>


    </div>


    <!-- =================================================
         EMPLOYEE ACTIVITY
         ================================================= -->

    <h2 class="section-title">
        Employee Activity
    </h2>


    <div
        id="employeeGrid"
        class="employee-grid"
    >
    </div>


</div>


<script>


// =========================================================
// API URL
// =========================================================

// Relative URL is intentional.
// It works both locally and on Vercel.

const API_URL = "/api/team";


// =========================================================
// FORMAT DATE
// =========================================================

function formatDateTime(
    timestamp
) {

    if (!timestamp) {

        return "--";
    }


    const date = new Date(
        timestamp
    );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "--";
    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",

            month: "2-digit",

            year: "2-digit",

            hour: "2-digit",

            minute: "2-digit",

            second: "2-digit",

            hour12: true
        }
    );
}


// =========================================================
// LOAD TEAM DATA
// =========================================================

async function loadTeamData() {


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    try {


        const response =
            await fetch(
                API_URL,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );
        }


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            throw new Error(
                "Invalid server response"
            );
        }


        errorBox.style.display =
            "none";


        // =================================================
        // SUMMARY
        // =================================================

        document.getElementById(
            "totalEmployees"
        ).textContent =
            data.total_employees || 0;


        document.getElementById(
            "activeEmployees"
        ).textContent =
            data.active_employees || 0;


        document.getElementById(
            "offlineEmployees"
        ).textContent =
            data.offline_employees || 0;


        // =================================================
        // EMPLOYEES
        // =================================================

        renderEmployees(
            data.employees || []
        );


        // =================================================
        // REFRESH TIME
        // =================================================

        document.getElementById(
            "lastRefresh"
        ).textContent =
            new Date().toLocaleString(
                "en-IN",
                {
                    day: "2-digit",

                    month: "2-digit",

                    year: "2-digit",

                    hour: "2-digit",

                    minute: "2-digit",

                    second: "2-digit",

                    hour12: true
                }
            );


    }

    catch (error) {


        console.error(
            "Dashboard error:",
            error
        );


        errorBox.style.display =
            "block";


        document.getElementById(
            "totalEmployees"
        ).textContent = "0";


        document.getElementById(
            "activeEmployees"
        ).textContent = "0";


        document.getElementById(
            "offlineEmployees"
        ).textContent = "0";


        document.getElementById(
            "employeeGrid"
        ).innerHTML = "";
    }
}


// =========================================================
// RENDER EMPLOYEES
// =========================================================

function renderEmployees(
    employees
) {


    const grid =
        document.getElementById(
            "employeeGrid"
        );


    grid.innerHTML = "";


    if (
        employees.length === 0
    ) {

        grid.innerHTML = `
            <div class="employee-card">
                <div class="no-data">
                    No employee activity available.
                </div>
            </div>
        `;

        return;
    }


    // Active employees first

    employees.sort(
        (a, b) => {

            if (
                a.status ===
                b.status
            ) {

                return 0;
            }

            return a.status ===
                "active"
                ? -1
                : 1;
        }
    );


    employees.forEach(
        employee => {

            const card =
                document.createElement(
                    "div"
                );


            const isActive =
                employee.status ===
                "active";


            card.className =
                "employee-card" +
                (
                    isActive
                        ? ""
                        : " offline"
                );


            // =================================================
            // APPLICATION USAGE
            // =================================================

            const usage =
                employee.application_usage
                || {};


            const usageEntries =
                Object.entries(
                    usage
                );


            let usageHTML = "";


            if (
                usageEntries.length === 0
            ) {

                usageHTML = `
                    <div class="no-data">
                        No application usage data.
                    </div>
                `;

            }

            else {

                usageEntries.forEach(
                    ([app, time]) => {

                        usageHTML += `
                            <tr>
                                <td>
                                    ${escapeHTML(app)}
                                </td>

                                <td>
                                    ${escapeHTML(time)}
                                </td>
                            </tr>
                        `;
                    }
                );

                usageHTML = `
                    <table class="usage-table">

                        <thead>

                            <tr>

                                <th>
                                    Application
                                </th>

                                <th>
                                    Time Used
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            ${usageHTML}

                        </tbody>

                    </table>
                `;
            }


            // =================================================
            // CARD
            // =================================================

            card.innerHTML = `

                <div class="employee-header">

                    <div class="employee-id">

                        ${escapeHTML(
                            employee.employee_id
                            || "Unknown"
                        )}

                    </div>


                    <div class="
                        status
                        ${
                            isActive
                                ? "active"
                                : "offline"
                        }
                    ">

                        ${
                            isActive
                                ? "Active"
                                : "Offline"
                        }

                    </div>

                </div>


                <div class="details">


                    <div class="detail-row">

                        <div class="detail-label">
                            Current Application
                        </div>

                        <div class="detail-value">

                            ${
                                escapeHTML(
                                    employee.application
                                    || "Unknown"
                                )
                            }

                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Observed Active Time
                        </div>

                        <div class="detail-value">

                            ${
                                escapeHTML(
                                    employee.active_time
                                    || "0h 0m"
                                )
                            }

                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Last Sync
                        </div>

                        <div class="detail-value">

                            ${
                                formatDateTime(
                                    employee.timestamp
                                )
                            }

                        </div>

                    </div>


                </div>


                <div class="usage-title">
                    Application Usage
                </div>


                ${
                    usageEntries.length === 0
                        ? `
                            <div class="no-data">
                                No application usage data.
                            </div>
                        `
                        : usageHTML
                }

            `;


            grid.appendChild(
                card
            );

        }
    );
}


// =========================================================
// HTML ESCAPE
// =========================================================

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value);


    return div.innerHTML;
}


// =========================================================
// INITIAL LOAD
// =========================================================

loadTeamData();


// =========================================================
// AUTOMATIC REFRESH
// =========================================================

// Every 60 seconds

setInterval(
    loadTeamData,
    60000
);


</script>


</body>

</html>
