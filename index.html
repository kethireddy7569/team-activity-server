<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Team Activity Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f8fafc
        );

    color: #1e293b;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}

/* HEADER */

.header {
    background: white;

    border-radius: 15px;

    padding: 25px;

    margin-bottom: 20px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
}

.title {
    margin: 0;

    font-size: 30px;

    font-weight: 700;
}

.subtitle {
    margin-top: 8px;

    color: #64748b;

    font-size: 15px;
}

.refresh-info {
    margin-top: 12px;

    font-size: 13px;

    color: #64748b;
}

.connection {
    margin-top: 8px;

    color: #16a34a;

    font-weight: 600;
}

/* DATE SECTION */

.date-section {
    background: white;

    border-radius: 15px;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);

    display: flex;

    align-items: center;

    gap: 15px;

    flex-wrap: wrap;
}

.date-section label {
    font-weight: 600;
}

.date-section input {
    padding: 10px 14px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    font-size: 14px;

    cursor: pointer;
}

.today-btn {
    border: none;

    background: #2563eb;

    color: white;

    padding: 10px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: 600;
}

.today-btn:hover {
    background: #1d4ed8;
}

.selected-date {
    color: #475569;

    font-size: 14px;

    font-weight: 600;
}

/* ERROR */

.error-box {
    display: none;

    background: #fee2e2;

    color: #991b1b;

    padding: 15px;

    border-radius: 10px;

    margin-bottom: 20px;

    font-weight: 600;
}

/* SUMMARY */

.summary {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

    margin-bottom: 25px;
}

.summary-card {
    background: white;

    padding: 22px;

    border-radius: 15px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
}

.summary-label {
    color: #64748b;

    font-size: 14px;
}

.summary-value {
    margin-top: 8px;

    font-size: 30px;

    font-weight: 700;
}

/* EMPLOYEE GRID */

.employee-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}

.employee-card {
    background: white;

    border-radius: 15px;

    padding: 22px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
}

.employee-card.offline {
    opacity: 0.75;
}

.employee-header {
    display: flex;

    justify-content:
        space-between;

    align-items: flex-start;

    gap: 10px;

    margin-bottom: 20px;
}

.employee-name {
    font-size: 19px;

    font-weight: 700;

    margin-bottom: 5px;
}

.employee-id {
    color: #64748b;

    font-size: 13px;
}

.status {
    padding: 6px 12px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: 700;
}

.status.active {
    background: #dcfce7;

    color: #166534;
}

.status.offline {
    background: #fee2e2;

    color: #991b1b;
}

/* DETAILS */

.details {
    border-top:
        1px solid #e2e8f0;

    padding-top: 15px;
}

.detail-row {
    display: grid;

    grid-template-columns:
        180px 1fr;

    gap: 10px;

    padding: 8px 0;
}

.detail-label {
    color: #64748b;

    font-size: 14px;
}

.detail-value {
    font-weight: 600;

    font-size: 14px;
}

/* APPLICATION USAGE */

.usage-title {
    margin-top: 20px;

    margin-bottom: 10px;

    font-size: 16px;

    font-weight: 700;
}

.usage-table {
    width: 100%;

    border-collapse:
        collapse;
}

.usage-table th {
    text-align: left;

    padding: 10px;

    background: #f1f5f9;

    font-size: 13px;
}

.usage-table td {
    padding: 10px;

    border-bottom:
        1px solid #e2e8f0;

    font-size: 13px;
}

.no-data {
    text-align: center;

    padding: 30px;

    color: #64748b;

    background: white;

    border-radius: 15px;
}


.browser-history-title {
    margin-top: 20px;

    margin-bottom: 10px;

    font-size: 16px;

    font-weight: 700;
}

.browser-history {
    width: 100%;

    border: 1px solid #e2e8f0;

    border-radius: 8px;

    overflow: hidden;

    background: white;
}

.browser-history-item {
    padding: 10px;

    border-bottom:
        1px solid #e2e8f0;
}

.browser-history-item:last-child {
    border-bottom: none;
}

.browser-history-page-title {
    font-weight: 600;

    font-size: 13px;

    margin-bottom: 5px;

    word-break: break-word;
}

.browser-history-url {
    color: #2563eb;

    font-size: 12px;

    word-break: break-all;

    margin-bottom: 5px;
}

.browser-history-time {
    color: #64748b;

    font-size: 11px;
}

.browser-history-loading {
    padding: 10px;

    color: #64748b;

    font-size: 13px;
}

.browser-history-empty {
    padding: 15px;

    color: #64748b;

    text-align: center;

    font-size: 13px;
}

.browser-history-error {
    padding: 10px;

    color: #991b1b;

    background: #fee2e2;

    font-size: 13px;
}


/* RESPONSIVE */

@media (max-width: 900px) {

    .summary {
        grid-template-columns:
            1fr;
    }

    .employee-grid {
        grid-template-columns:
            1fr;
    }

    .detail-row {
        grid-template-columns:
            1fr;
    }

}

</style>

</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1 class="title">
            Team Activity Dashboard
        </h1>

        <div class="subtitle">
            Application Activity Tracking & Centralized Monitoring
        </div>

        <div class="refresh-info">

            Dashboard refreshes automatically every 1 minute.

            Last dashboard refresh:

            <span id="lastRefresh">
                -
            </span>

        </div>

        <div
            class="connection"
            id="connectionStatus">

            ● Connected

        </div>

    </div>


    <!-- DATE SELECTOR -->

    <div class="date-section">

        <label for="datePicker">
            Select Date:
        </label>

        <input
            type="date"
            id="datePicker"
        >

        <button
            class="today-btn"
            onclick="loadToday()">

            Today

        </button>

        <span
            class="selected-date"
            id="selectedDateText">

            Loading...

        </span>

    </div>


    <!-- ERROR -->

    <div
        class="error-box"
        id="errorBox">

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <div class="summary-label">
                Total Employees
            </div>

            <div
                class="summary-value"
                id="totalEmployees">

                0

            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Active Employees
            </div>

            <div
                class="summary-value"
                id="activeEmployees">

                0

            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Offline / Inactive
            </div>

            <div
                class="summary-value"
                id="offlineEmployees">

                0

            </div>

        </div>

    </div>


    <!-- EMPLOYEE CARDS -->

    <div
        class="employee-grid"
        id="employeeGrid">

    </div>

</div>


<script>


const API_URL = "/api/team";

const DAILY_API_URL =
    "/api/team/daily";



function getTodayDate() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatSelectedDate(
    dateString
) {

    if (!dateString) {
        return "-";
    }

    const parts =
        dateString.split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}




const datePicker =
    document.getElementById(
        "datePicker"
    );

datePicker.value =
    getTodayDate();


datePicker.addEventListener(
    "change",
    function () {

        loadSelectedDate(
            this.value
        );

    }
);




async function loadSelectedDate(
    selectedDate
) {

    if (!selectedDate) {
        return;
    }

    document.getElementById(
        "selectedDateText"
    ).textContent =
        "Selected Date: " +
        formatSelectedDate(
            selectedDate
        );


    if (
        selectedDate ===
        getTodayDate()
    ) {

        await loadLiveTeamData();

    } else {

        await loadDailyTeamData(
            selectedDate
        );

    }

}


function loadToday() {

    const today =
        getTodayDate();

    datePicker.value =
        today;

    loadSelectedDate(
        today
    );

}


async function loadLiveTeamData() {

    hideError();

    try {

        const response =
            await fetch(
                API_URL
            );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            throw new Error(
                data.message ||
                "Unable to load team data"
            );

        }


        updateSummary(
            data.employees || []
        );


        renderEmployees(
            data.employees || [],
            false
        );


        updateRefreshTime();


    } catch (error) {

        showError(
            "Unable to load live team data: " +
            error.message
        );

    }

}



async function loadDailyTeamData(
    selectedDate
) {

    hideError();

    try {

        const response =
            await fetch(
                `${DAILY_API_URL}?date=${encodeURIComponent(selectedDate)}`
            );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            throw new Error(
                data.message ||
                "Unable to load daily data"
            );

        }


        const employees =
            data.employees || [];


        updateSummary(
            employees
        );


        renderEmployees(
            employees,
            true
        );


        updateRefreshTime();


    } catch (error) {

        showError(
            "Unable to load data for " +
            formatSelectedDate(
                selectedDate
            ) +
            ": " +
            error.message
        );

    }

}


function updateSummary(
    employees
) {

    const total =
        employees.length;

    let active = 0;


    employees.forEach(
        employee => {

            if (
                employee.status ===
                "active"
            ) {

                active++;

            }

        }
    );


    const offline =
        total - active;


    document.getElementById(
        "totalEmployees"
    ).textContent =
        total;


    document.getElementById(
        "activeEmployees"
    ).textContent =
        active;


    document.getElementById(
        "offlineEmployees"
    ).textContent =
        offline;

}



function renderEmployees(
    employees,
    isHistorical
) {

    const grid =
        document.getElementById(
            "employeeGrid"
        );


    grid.innerHTML = "";


    if (
        !employees ||
        employees.length === 0
    ) {

        grid.innerHTML = `
            <div class="no-data">
                No activity data found for
                the selected date.
            </div>
        `;

        return;

    }


    /* Active employees first */

    employees.sort(
        (a, b) => {

            if (
                a.status ===
                b.status
            ) {

                return 0;

            }

            return a.status ===
                "active"
                ? -1
                : 1;

        }
    );


    employees.forEach(
        employee => {

            const card =
                document.createElement(
                    "div"
                );


            /* STATUS */

            const status =
                employee.status ===
                "active"
                    ? "active"
                    : "offline";


            const statusText =
                status === "active"
                    ? "Active"
                    : "Offline / Inactive";


            card.className =
                `employee-card ${status}`;


            /* EMPLOYEE NAME */

            const employeeName =
                escapeHTML(
                    employee.employee_name ||
                    "Employee Name Not Configured"
                );


            /* EMPLOYEE ID */

            const employeeId =
                escapeHTML(
                    employee.employee_id ||
                    "-"
                );


            /* CURRENT APPLICATION */

            const application =
                escapeHTML(
                    employee.application ||
                    employee.last_application ||
                    "Unknown"
                );


            /* ACTIVE TIME */

            const activeTime =
                escapeHTML(
                    employee.active_time ||
                    formatDuration(
                        employee.active_seconds
                    )
                );


            /* IDLE / AFK TIME */

            const idleTime =
                employee.idle_time
                    ? escapeHTML(
                        employee.idle_time
                    )
                    : formatDuration(
                        employee.idle_seconds
                    );


            /* LAST SYNC */

            const timestamp =
                employee.last_sync_ist ||
                employee.last_sync ||
                employee.timestamp;


            const formattedTime =
                formatDateTime(
                    timestamp
                );


            /* APPLICATION USAGE */

            const usage =
                employee.application_usage ||
                {};


            let usageRows = "";


            const usageEntries =
                Object.entries(
                    usage
                );


            if (
                usageEntries.length === 0
            ) {

                usageRows = `
                    <tr>
                        <td colspan="2">
                            No application usage data
                        </td>
                    </tr>
                `;

            } else {


                /* Sort using numeric OR formatted values */

                usageEntries.sort(
                    (a, b) =>
                        durationToSeconds(b[1]) -
                        durationToSeconds(a[1])
                );


                usageEntries.forEach(
                    ([appName, seconds]) => {

                        usageRows += `
                            <tr>

                                <td>
                                    ${escapeHTML(appName)}
                                </td>

                                <td>
                                    ${formatDuration(seconds)}
                                </td>

                            </tr>
                        `;

                    }
                );

            }


            /* CARD HTML */

            card.innerHTML = `

                <div class="employee-header">

                    <div>

                        <div class="employee-name">
                            ${employeeName}
                        </div>

                        <div class="employee-id">
                            Employee ID:
                            ${employeeId}
                        </div>

                    </div>


                    <div class="status ${status}">
                        ${statusText}
                    </div>

                </div>


                <div class="details">


                    <div class="detail-row">

                        <div class="detail-label">
                            Current Application
                        </div>

                        <div class="detail-value">
                            ${application}
                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Observed Active Time
                        </div>

                        <div class="detail-value">
                            ${activeTime}
                        </div>

                    </div>


                    <!-- IDLE / AFK TIME -->

                    <div class="detail-row">

                        <div class="detail-label">
                            Idle / AFK Time
                        </div>

                        <div class="detail-value">
                            ${idleTime}
                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Last Sync
                        </div>

                        <div class="detail-value">
                            ${formattedTime}
                        </div>

                    </div>


                    ${
                        isHistorical
                        ? `
                        <div class="detail-row">

                            <div class="detail-label">
                                Record Date
                            </div>

                            <div class="detail-value">
                                ${formatSelectedDate(
                                    employee.date
                                )}
                            </div>

                        </div>
                        `
                        : ""
                    }


                </div>


                <div class="usage-title">
                    Application Usage
                </div>


                <table class="usage-table">

                    <thead>

                        <tr>

                            <th>
                                Application
                            </th>

                            <th>
                                Time Used
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${usageRows}

                    </tbody>

                </table>


                <!-- =================================================
                     BROWSER HISTORY - ONLY NEW ADDITION
                ================================================== -->

                <div class="browser-history-title">
                    Browser History
                </div>


                <div
                    id="browser-history-${employee.employee_id}"
                    class="browser-history-loading"
                >

                    Loading browser history...

                </div>

            `;


            grid.appendChild(
                card
            );


            /* Load browser history */

            loadBrowserHistory(
                employee.employee_id,
                `browser-history-${employee.employee_id}`
            );

        }
    );

}


/* =====================================================
   BROWSER HISTORY - ONLY NEW FUNCTION
===================================================== */

async function loadBrowserHistory(
    employeeId,
    elementId
) {

    const container =
        document.getElementById(
            elementId
        );


    if (!container) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/browser-history?employee_id=${encodeURIComponent(employeeId)}&limit=20`
            );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        const history =
            data.history || [];


        if (
            history.length === 0
        ) {

            container.innerHTML = `

                <div class="browser-history-empty">

                    No browser history available

                </div>

            `;

            return;

        }


        let historyHTML = "";


        history.forEach(
            item => {

                const title =
                    item.title ||
                    "Untitled";


                const url =
                    item.url ||
                    "-";


                const visitTime =
                    item.visit_time ||
                    item.created_at ||
                    "-";


                historyHTML += `

                    <div
                        class="browser-history-item"
                    >

                        <div
                            class="browser-history-page-title"
                        >

                            ${escapeHTML(
                                title
                            )}

                        </div>


                      


                        <div
                            class="browser-history-time"
                        >

                            Visited:
                            ${formatDateTime(
                                visitTime
                            )}

                        </div>

                    </div>

                `;

            }
        );


        container.innerHTML = `

            <div class="browser-history">

                ${historyHTML}

            </div>

        `;


    } catch (error) {

        console.error(
            "Browser history error:",
            error
        );


        container.innerHTML = `

            <div
                class="browser-history-error"
            >

                Browser history unavailable

            </div>

        `;

    }

}


/* =====================================================
   CONVERT DURATION TO SECONDS
===================================================== */

function durationToSeconds(
    value
) {

    /* Numeric seconds */

    if (
        typeof value ===
        "number"
    ) {

        return value;

    }


    if (!value) {

        return 0;

    }


    const text =
        String(value).trim();


    /*
       Supports:
       "2h 30m"
       "2h"
       "30m"
    */

    const fullMatch =
        text.match(
            /^(\d+)\s*h\s*(\d+)\s*m$/i
        );


    if (fullMatch) {

        return (
            Number(fullMatch[1]) * 3600 +
            Number(fullMatch[2]) * 60
        );

    }


    const hourMatch =
        text.match(
            /^(\d+)\s*h$/i
        );


    if (hourMatch) {

        return (
            Number(hourMatch[1]) * 3600
        );

    }


    const minuteMatch =
        text.match(
            /^(\d+)\s*m$/i
        );


    if (minuteMatch) {

        return (
            Number(minuteMatch[1]) * 60
        );

    }


    /* Numeric string */

    if (!isNaN(Number(text))) {

        return Number(text);

    }


    return 0;

}


/* =====================================================
   FORMAT DATE/TIME
===================================================== */

function formatDateTime(
    timestamp
) {

    if (!timestamp) {

        return "-";

    }


    try {

        const date =
            new Date(timestamp);


        if (
            isNaN(
                date.getTime()
            )
        ) {

            return "-";

        }


        return date.toLocaleString(
            "en-IN",
            {
                day: "2-digit",

                month: "2-digit",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hour12: true,

                timeZone:
                    "Asia/Kolkata"
            }
        );

    } catch (error) {

        return "-";

    }

}


/* =====================================================
   FORMAT DURATION
===================================================== */

function formatDuration(
    value
) {

    const seconds =
        durationToSeconds(
            value
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    return `${hours}h ${minutes}m`;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ERROR HANDLING
===================================================== */

function showError(
    message
) {

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.textContent =
        message;


    errorBox.style.display =
        "block";


    document.getElementById(
        "connectionStatus"
    ).textContent =
        "● Connection Error";


    document.getElementById(
        "connectionStatus"
    ).style.color =
        "#dc2626";

}


function hideError() {

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.style.display =
        "none";


    document.getElementById(
        "connectionStatus"
    ).textContent =
        "● Connected";


    document.getElementById(
        "connectionStatus"
    ).style.color =
        "#16a34a";

}


/* =====================================================
   REFRESH TIME
===================================================== */

function updateRefreshTime() {

    document.getElementById(
        "lastRefresh"
    ).textContent =
        new Date().toLocaleTimeString(
            "en-IN",
            {
                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit",

                hour12: true
            }
        );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadSelectedDate(
    getTodayDate()
);


/* =====================================================
   AUTO REFRESH - 1 MINUTE
===================================================== */

setInterval(
    function () {

        const selectedDate =
            datePicker.value;


        if (
            selectedDate ===
            getTodayDate()
        ) {

            loadLiveTeamData();

        } else {

            loadDailyTeamData(
                selectedDate
            );

        }
