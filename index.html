<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Activity Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #555;
        }

        .card p {
            font-size: 28px;
            margin: 0;
            font-weight: bold;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f3f5;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }

        .refresh {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .summary {
                flex-direction: column;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Team Activity Dashboard</h1>

    <div class="subtitle">
        Live Employee Activity Monitoring
    </div>

    <div class="summary">

        <div class="card">
            <h3>Total Employees</h3>
            <p id="totalEmployees">0</p>
        </div>

        <div class="card">
            <h3>Active Employees</h3>
            <p id="activeEmployees">0</p>
        </div>

    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Status</th>
                    <th>Application</th>
                    <th>Window</th>
                    <th>Last Sync</th>
                </tr>
            </thead>

            <tbody id="activityTable">
                <tr>
                    <td colspan="5">Loading...</td>
                </tr>
            </tbody>

        </table>

        <button class="refresh" onclick="loadActivity()">
            Refresh
        </button>

    </div>

</div>


<script>

const API_URL =
    "https://team-activity-server.vercel.app/api/team";


async function loadActivity() {

    try {

        const response = await fetch(API_URL);

        const data = await response.json();

        const employees = data.employees || [];

        document.getElementById("totalEmployees").textContent =
            employees.length;

        const activeCount = employees.filter(
            employee => employee.status === "active"
        ).length;

        document.getElementById("activeEmployees").textContent =
            activeCount;


        const table =
            document.getElementById("activityTable");

        table.innerHTML = "";


        if (employees.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5">
                        No employee activity available
                    </td>
                </tr>
            `;

            return;
        }


        employees.forEach(employee => {

            const row = document.createElement("tr");

            const statusClass =
                employee.status === "active"
                    ? "active"
                    : "inactive";


            row.innerHTML = `
                <td>${employee.employee_id || "-"}</td>

                <td class="${statusClass}">
                    ${employee.status || "-"}
                </td>

                <td>
                    ${employee.application || "-"}
                </td>

                <td>
                    ${employee.window_title || "-"}
                </td>

                <td>
                    ${employee.timestamp || "-"}
                </td>
            `;

            table.appendChild(row);

        });

    }

    catch (error) {

        console.error(error);

        document.getElementById("activityTable").innerHTML = `
            <tr>
                <td colspan="5">
                    Unable to load team activity
                </td>
            </tr>
        `;
    }
}


// Load immediately
loadActivity();


// Refresh dashboard every 10 seconds
setInterval(loadActivity, 10000);

</script>

</body>
</html>
